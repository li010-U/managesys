[alembic]
script_location = alembic
# Default uses SQLite. For production set env var DATABASE_URL, e.g.:
#   DATABASE_URL=postgresql+asyncpg://user:pass@127.0.0.1:5432/managesys
# The url below must be an ASYNC driver URL (matches app engine).
sqlalchemy.url = sqlite+aiosqlite:///./data/managesys.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
